name: Build and Deploy Jekyll Site

on:
  # Запускается при пуше в любую ветку, КРОМЕ main
  push:
    branches-ignore:
      - 'main'

  # Позволяет запускать этот workflow вручную со страницы Actions
  workflow_dispatch:

# Устанавливаем права для GITHUB_TOKEN для развертывания на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только одно одновременное развертывание, чтобы избежать гонки состояний
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  # Job для сборки сайта
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run pre-build script to generate data
        run: python3 scripts/pre-build.py

      - name: Upload 'projects' directory for inspection
        uses: actions/upload-artifact@v4
        with:
          name: raw-projects-data
          path: ./

      - name: Update Jekyll config with dynamic baseurl
        run: |
          echo "url: https://shikofx.github.io" >> _config.yml
          echo "baseurl: /github-pages" >> _config.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Copy assets to report directory
        run: |
          echo "Copying assets into ./_site/${{ github.ref_name }}/"
          sudo cp -r ./_site/assets ./_site/${{ github.ref_name }}/

      - name: Verify ./_site
        shell: bash
        run: |
          ls -R ./_site
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
